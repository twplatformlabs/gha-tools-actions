# yamllint disable rule:line-length
# yamllint disable rule:truthy
---
name: OSSF Scorecard analysis workflow
run-name: Scorecard Scan

on:
  push:
    branches:
      - main
  schedule:
    - cron: '30 1 * * 6'
  workflow_dispatch:

permissions:
  contents: read

jobs:

  ossf-scorecard:
    name: scorecard scan
    uses: twplatformlabs/gha-tools-workflows/.github/workflows/ossf-scorecard-scan.yaml@main
    permissions:
      contents: read
      security-events: write
      id-token: write
